    <link rel="stylesheet" href="css/style.css">

    <style>
        .product-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 80px 20px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: #b979ff;
            text-decoration: none;
            font-weight: 600;
        }

        .product-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .product-image {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 24px;
            background: #111;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .product-category {
            display: inline-block;
            color: #c8ff35;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .product-title {
            font-size: clamp(38px, 6vw, 64px);
            line-height: 1;
            margin: 0 0 20px;
        }

        .product-description {
            color: #aaa;
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .product-price {
            font-size: 32px;
            font-weight: 800;
            color: #c8ff35;
            margin-bottom: 30px;
        }

        .buy-btn {
            display: inline-block;
            padding: 16px 28px;
            border-radius: 14px;
            background: #c8ff35;
            color: #050505;
            text-decoration: none;
            font-weight: 800;
            transition: 0.25s ease;
        }

        .buy-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(200,255,53,0.2);
        }

        .included-section {
            margin-top: 90px;
        }

        .included-section h2 {
            font-size: 36px;
            margin-bottom: 30px;
        }

        .included-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .included-item {
            background: #101010;
            border: 1px solid rgba(255,255,255,0.07);
            padding: 18px 20px;
            border-radius: 14px;
            color: #ddd;
        }

        .included-item::before {
            content: "✓";
            color: #c8ff35;
            font-weight: 900;
            margin-right: 10px;
        }

        .not-found {
            text-align: center;
            padding: 120px 20px;
        }

        @media (max-width: 800px) {
            .product-layout {
                grid-template-columns: 1fr;
                gap: 35px;
            }

            .included-grid {
                grid-template-columns: 1fr;
            }

            .product-page {
                padding-top: 50px;
            }
        }
    </style>
</head>
