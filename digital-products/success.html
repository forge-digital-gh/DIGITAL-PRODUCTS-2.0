<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Successful | Forge Digital</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 520px;
            background: #111;
            border: 1px solid #272727;
            border-radius: 24px;
            padding: 40px 25px;
            text-align: center;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 30px;
        }

        p {
            color: #aaa;
            line-height: 1.6;
        }

        .reference {
            margin: 20px 0;
            padding: 14px;
            background: #080808;
            border-radius: 12px;
            color: #888;
            font-size: 13px;
            word-break: break-all;
        }

        .download {
            display: none;
            margin-top: 20px;
            padding: 16px 25px;
            background: #c8ff35;
            color: #050505;
            text-decoration: none;
            font-weight: bold;
            border-radius: 12px;
        }

        .download:hover {
            transform: translateY(-2px);
        }

        .status {
            margin-top: 20px;
            color: #aaa;
        }

        .error {
            color: #ff5c5c;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="icon">✅</div>

    <h1>Payment Successful</h1>

    <p>
        Your payment has been verified successfully.
        Your digital product is ready.
    </p>

    <div class="reference">
        Reference: <span id="reference">Checking...</span>
    </div>

    <div id="status" class="status">
        Preparing your download...
    </div>

    <a id="downloadButton" class="download">
        📥 Download Your Product
    </a>

</div>

<script>

    // YOUR CLOUDFLARE WORKER
    const WORKER_URL =
        "https://forge-digital-payment.rampagewwe2.workers.dev/";

    const params = new URLSearchParams(window.location.search);

    const reference = params.get("reference");
    const productId = params.get("product");

    const referenceElement =
        document.getElementById("reference");

    const statusElement =
        document.getElementById("status");

    const downloadButton =
        document.getElementById("downloadButton");


    referenceElement.textContent =
        reference || "Unknown";


    async function verifyPayment() {

        if (!reference || !productId) {

            statusElement.textContent =
                "Missing payment information.";

            statusElement.classList.add("error");

            return;
        }

        try {

            const response = await fetch(WORKER_URL, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    reference: reference,

                    product: productId

                })

            });


            const result = await response.json();

            console.log("Worker response:", result);


            if (!response.ok || !result.success) {

                throw new Error(
                    result.error || "Payment verification failed."
                );

            }


            /*
             * Worker returns something like:
             *
             * file:
             * AI-Prompts-Digital-Products-Kit.md
             */

            const fileName = result.product.file;


            /*
             * The .md files are inside the main project,
             * so create a URL relative to success.html.
             */

            const downloadURL =
                "./" + fileName;


            downloadButton.href = downloadURL;

            downloadButton.download = fileName;

            downloadButton.style.display = "inline-block";


            statusElement.textContent =
                "Your product is ready to download.";

            statusElement.style.color =
                "#c8ff35";


            /*
             * Automatically start download.
             */

            setTimeout(() => {

                downloadButton.click();

            }, 800);


        } catch (error) {

            console.error(error);

            statusElement.textContent =
                error.message || "Something went wrong.";

            statusElement.classList.add("error");

        }

    }


    verifyPayment();

</script>

</body>
</html>
