<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout | Forge Digital</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <!-- Paystack -->
    <script src="https://js.paystack.co/v2/inline.js"></script>


    <style>

        .checkout-page {

            max-width: 1000px;

            margin: 0 auto;

            padding: 80px 20px;

        }


        .checkout-title {

            text-align: center;

            margin-bottom: 50px;

        }


        .checkout-title h1 {

            font-size:
                clamp(40px, 6vw, 64px);

            margin-bottom: 12px;

        }


        .checkout-title p {

            color: #999;

        }


        .checkout-layout {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 40px;

        }


        .checkout-card {

            background: #101010;

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius: 22px;

            padding: 30px;

        }


        .checkout-card h2 {

            margin-bottom: 25px;

        }


        .field {

            margin-bottom: 20px;

        }


        .field label {

            display: block;

            margin-bottom: 8px;

            font-weight: 700;

        }


        .field input {

            width: 100%;

            box-sizing: border-box;

            padding: 15px;

            border-radius: 12px;

            border:
                1px solid
                rgba(255,255,255,0.1);

            background: #080808;

            color: white;

            font-size: 16px;

            outline: none;

        }


        .field input:focus {

            border-color:
                #b979ff;

        }


        .product-summary {

            display: flex;

            gap: 18px;

            align-items: center;

            margin-bottom: 30px;

        }


        .product-summary img {

            width: 100px;

            height: 100px;

            object-fit: cover;

            border-radius: 15px;

        }


        .product-summary h3 {

            margin:
                0 0 8px;

        }


        .product-summary p {

            margin: 0;

            color:
                #c8ff35;

            font-weight: 800;

        }


        .total-row {

            display: flex;

            justify-content: space-between;

            border-top:
                1px solid
                rgba(255,255,255,0.1);

            padding-top: 20px;

            margin-top: 20px;

            font-size: 22px;

            font-weight: 800;

        }


        .pay-btn {

            width: 100%;

            border: none;

            padding: 17px;

            margin-top: 25px;

            border-radius: 14px;

            background:
                #c8ff35;

            color:
                #050505;

            font-size: 17px;

            font-weight: 900;

            cursor: pointer;

            transition:
                0.25s ease;

        }


        .pay-btn:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 10px 30px
                rgba(200,255,53,0.2);

        }


        .pay-btn:disabled {

            opacity: 0.5;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;

        }


        .secure-note {

            text-align: center;

            color: #777;

            font-size: 13px;

            margin-top: 15px;

        }


        .error-message {

            color:
                #ff6b6b;

            margin-top: 15px;

            display: none;

        }


        @media (max-width: 800px) {

            .checkout-layout {

                grid-template-columns: 1fr;

            }


            .checkout-page {

                padding-top: 50px;

            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="nav-logo">
            FORGE DIGITAL
        </div>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="products.html">
                Shop
            </a>

        </div>

    </nav>



    <!-- CHECKOUT -->

    <main class="checkout-page">


        <div class="checkout-title">

            <h1>
                Checkout
            </h1>

            <p>
                Complete your purchase and get your digital product.
            </p>

        </div>



        <div class="checkout-layout">


            <!-- CUSTOMER INFORMATION -->

            <div class="checkout-card">

                <h2>
                    Your Information
                </h2>


                <div class="field">

                    <label for="customerName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="customerName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                    >

                </div>



                <div class="field">

                    <label for="customerEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="customerEmail"
                        placeholder="you@example.com"
                        autocomplete="email"
                    >

                </div>


                <p
                    id="errorMessage"
                    class="error-message"
                ></p>

            </div>



            <!-- ORDER SUMMARY -->

            <div class="checkout-card">

                <h2>
                    Your Order
                </h2>


                <div
                    id="orderSummary"
                    class="product-summary"
                >

                    Loading product...

                </div>


                <div class="total-row">

                    <span>
                        Total
                    </span>

                    <span id="totalPrice">
                        --
                    </span>

                </div>


                <button
                    id="payButton"
                    class="pay-btn"
                    type="button"
                >
                    Pay Now →
                </button>


                <div class="secure-note">

                    🔒 Secure payment powered by Paystack

                </div>

            </div>

        </div>

    </main>



    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 Forge Digital. All rights reserved.
        </p>

    </footer>



    <!-- PRODUCTS -->

    <script src="js/products.js"></script>



    <script>

        /*
        ==========================================
        PAYSTACK PUBLIC KEY
        ==========================================
        */

        const PAYSTACK_PUBLIC_KEY =
            "pk_test_b01341fb1973365e11aa334d70136ab0ede380cb";



        /*
        ==========================================
        GET PRODUCT ID
        ==========================================
        */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const productId =
            params.get("id");



        /*
        ==========================================
        FIND PRODUCT
        ==========================================
        */

        const product =
            products.find(
                item =>
                    item.id === productId
            );



        /*
        ==========================================
        ELEMENTS
        ==========================================
        */

        const orderSummary =
            document.getElementById(
                "orderSummary"
            );


        const totalPrice =
            document.getElementById(
                "totalPrice"
            );


        const payButton =
            document.getElementById(
                "payButton"
            );


        const errorMessage =
            document.getElementById(
                "errorMessage"
            );



        /*
        ==========================================
        DISPLAY PRODUCT
        ==========================================
        */

        if (!product) {

            orderSummary.innerHTML = `
                <p>
                    Product not found.
                </p>
            `;

            totalPrice.textContent =
                "--";

            payButton.disabled =
                true;

        } else {

            const productName =
                product.name
                    .replaceAll("-", " ");


            orderSummary.innerHTML = `

                <img
                    src="${
                        product.image ||
                        "assets/covers/default.jpg"
                    }"
                    alt="${productName}"
                >

                <div>

                    <h3>
                        ${productName}
                    </h3>

                    <p>
                        $${product.price}
                    </p>

                </div>

            `;


            totalPrice.textContent =
                "$" + product.price;

        }



        /*
        ==========================================
        AMOUNT
        ==========================================
        */

        function getAmount() {

            const numericPrice =
                Number(
                    String(product.price)
                        .replace(
                            /[^\d.]/g,
                            ""
                        )
                );


            /*
            Paystack expects
            the smallest currency unit.

            Example:
            9.99 GHS
            =
            999 pesewas
            */

            return Math.round(
                numericPrice * 100
            );

        }



        /*
        ==========================================
        ERROR
        ==========================================
        */

        function showError(message) {

            errorMessage.textContent =
                message;

            errorMessage.style.display =
                "block";

        }



        /*
        ==========================================
        PAY
        ==========================================
        */

        payButton.addEventListener(
            "click",
            function () {

                errorMessage.style.display =
                    "none";


                /*
                PRODUCT CHECK
                */

                if (!product) {

                    showError(
                        "Product not found."
                    );

                    return;

                }



                /*
                CUSTOMER NAME
                */

                const name =
                    document
                        .getElementById(
                            "customerName"
                        )
                        .value
                        .trim();



                /*
                CUSTOMER EMAIL
                */

                const email =
                    document
                        .getElementById(
                            "customerEmail"
                        )
                        .value
                        .trim();



                /*
                VALIDATION
                */

                if (!name) {

                    showError(
                        "Please enter your full name."
                    );

                    return;

                }



                if (!email) {

                    showError(
                        "Please enter your email address."
                    );

                    return;

                }



                if (
                    !email.includes("@")
                ) {

                    showError(
                        "Please enter a valid email address."
                    );

                    return;

                }



                /*
                PUBLIC KEY CHECK
                */

                if (
                    !PAYSTACK_PUBLIC_KEY ||
                    PAYSTACK_PUBLIC_KEY ===
                    "YOUR_PAYSTACK_TEST_PUBLIC_KEY"
                ) {

                    showError(
                        "Paystack public key is missing."
                    );

                    return;

                }



                /*
                DISABLE BUTTON
                */

                payButton.disabled =
                    true;

                payButton.textContent =
                    "Opening Payment...";



                /*
                PAYSTACK
                */

                try {

                    const paystack =
                        new PaystackPop();


                    paystack.newTransaction({

                        key:
                            PAYSTACK_PUBLIC_KEY,


                        email:
                            email,


                        amount:
                            getAmount(),


                        currency:
                            "GHS",


                        metadata: {

                            customer_name:
                                name,

                            product_id:
                                product.id,

                            product_name:
                                product.name

                        },


                        /*
                        ==================================
                        PAYMENT SUCCESS
                        ==================================
                        */

                        onSuccess:
                            function(transaction) {

                                /*
                                Send BOTH:

                                reference
                                product

                                to success.html
                                */

                                window.location.href =
                                    "success.html"
                                    + "?reference="
                                    + encodeURIComponent(
                                        transaction.reference
                                    )
                                    + "&product="
                                    + encodeURIComponent(
                                        product.id
                                    );

                            },


                        /*
                        ==================================
                        PAYMENT CANCELLED
                        ==================================
                        */

                        onCancel:
                            function() {

                                payButton.disabled =
                                    false;

                                payButton.textContent =
                                    "Pay Now →";

                                showError(
                                    "Payment was cancelled."
                                );

                            }

                    });

                }


                catch (error) {

                    console.error(error);

                    payButton.disabled =
                        false;

                    payButton.textContent =
                        "Pay Now →";

                    showError(
                        "Unable to open Paystack. Please try again."
                    );

                }

            }
        );

    </script>


</body>

</html>
