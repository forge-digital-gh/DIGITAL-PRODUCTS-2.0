```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Products | Forge Digital</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #070707;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 7%;
            border-bottom: 1px solid #1d1d1d;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 24px;
            font-weight: 900;
        }

        .logo span {
            color: #00ff88;
        }

        .back {
            color: #888;
            text-decoration: none;
        }

        .back:hover {
            color: #00ff88;
        }

        .hero {
            text-align: center;
            padding: 80px 20px 50px;
        }

        .hero small {
            color: #00ff88;
            letter-spacing: 3px;
            font-weight: bold;
        }

        .hero h1 {
            font-size: clamp(45px, 7vw, 80px);
            margin: 15px 0;
            letter-spacing: -4px;
        }

        .hero p {
            color: #888;
            max-width: 550px;
            margin: auto;
            line-height: 1.6;
        }

        .products {
            width: 90%;
            max-width: 1200px;
            margin: 20px auto 80px;

            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));

            gap: 25px;
        }

        .product-card {
            background: #101010;
            border: 1px solid #222;
            border-radius: 20px;
            padding: 25px;
            transition: .25s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #00ff88;
        }

        .product-image {
            height: 180px;
            border-radius: 15px;
            background:
                linear-gradient(
                    135deg,
                    #111,
                    #181818
                );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 45px;
            margin-bottom: 20px;
        }

        .category {
            color: #00ff88;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .product-card h2 {
            font-size: 22px;
            margin: 10px 0;
        }

        .product-card p {
            color: #888;
            line-height: 1.5;
            min-height: 50px;
        }

        .bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-top: 25px;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
        }

        .buy {
            background: #00ff88;
            color: #000;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 900;
        }

        .buy:hover {
            box-shadow:
                0 8px 25px
                rgba(0,255,136,.2);
        }

        .error {
            text-align: center;
            color: #ff5555;
            padding: 50px;
        }

        @media(max-width:600px) {

            header {
                padding: 20px;
            }

            .hero {
                padding-top: 55px;
            }

            .hero h1 {
                letter-spacing: -2px;
            }

        }

    </style>

</head>


<body>


<header>

    <a href="index.html" class="logo">
        FORGE<span>DIGITAL</span>
    </a>

    <a href="index.html" class="back">
        ← Home
    </a>

</header>



<section class="hero">

    <small>FORGE DIGITAL STORE</small>

    <h1>Digital Products.</h1>

    <p>
        Premium AI tools, templates and digital resources
        built to help you create, grow and work smarter.
    </p>

</section>



<section
    class="products"
    id="productsContainer"
>

    <!-- Products appear here -->

</section>



<script src="js/products.js"></script>


<script>

const container =
    document.getElementById("productsContainer");


if (typeof products === "undefined") {

    container.innerHTML = `
        <div class="error">
            Products could not be loaded.<br><br>
            Check that <strong>js/products.js</strong>
            exists.
        </div>
    `;

} else if (products.length === 0) {

    container.innerHTML = `
        <div class="error">
            No products found.
        </div>
    `;

} else {

    products.forEach(product => {

        const card =
            document.createElement("div");

        card.className =
            "product-card";


        card.innerHTML = `

            <div class="product-image">
                ✦
            </div>

            <div class="category">
                ${product.category}
            </div>

            <h2>
                ${product.name}
            </h2>

            <p>
                Premium digital resource
                from Forge Digital.
            </p>

            <div class="bottom">

                <div class="price">
                    $${Number(product.price).toFixed(2)}
                </div>

                <a
                    class="buy"
                    href="product.html?id=${encodeURIComponent(product.id)}"
                >
                    View Product →
                </a>

            </div>

        `;


        container.appendChild(card);

    });

}

</script>


</body>

</html>
```
