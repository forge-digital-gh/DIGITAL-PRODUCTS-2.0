<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Successful | Forge Digital</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
        }

        .success-box {
            width: 100%;
            max-width: 520px;
            padding: 40px 25px;
            text-align: center;
            background: #101010;
            border: 1px solid #252525;
            border-radius: 22px;
            box-shadow: 0 0 40px rgba(155, 92, 255, 0.12);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 30px;
        }

        p {
            color: #aaa;
            line-height: 1.6;
        }

        .status {
            margin: 25px 0;
            padding: 15px;
            border-radius: 12px;
            background: #181818;
            color: #c8ff35;
        }

        .download-btn {
            display: none;
            margin-top: 20px;
            padding: 15px 25px;
            border-radius: 12px;
            background: #c8ff35;
            color: #050505;
            text-decoration: none;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        .download-btn:hover {
            transform: translateY(-2px);
        }

        .error {
            color: #ff6b6b;
        }
    </style>
</head>

<body>

<div class="success-box">

    <div class="icon">✓</div>

    <h1>Payment Successful</h1>

    <p>
        Your payment has been verified.
    </p>

    <div id="status" class="status">
        Preparing your download...
    </div>

    <a
        id="downloadButton"
        class="download-btn"
        href="#"
        target="_blank"
        rel="noopener"
    >
        Download Your Product →
    </a>

</div>


<script>

    // CLOUDFLARE WORKER
    const WORKER_URL =
        "https://forge-digital-payment-v2.rampagewwe2.workers.dev/";


    // Get information from the URL
    const params =
        new URLSearchParams(window.location.search);


    const reference =
        params.get("reference");


    const productId =
        params.get("product");


    // Page elements
    const statusBox =
        document.getElementById("status");


    const downloadButton =
        document.getElementById("downloadButton");


    async function verifyPayment() {

        // Make sure payment information exists
        if (!reference || !productId) {

            statusBox.textContent =
                "Missing payment information.";

            statusBox.classList.add("error");

            return;
        }


        try {

            // Send payment reference to Cloudflare Worker
            const response =
                await fetch(WORKER_URL, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        reference: reference,

                        product: productId

                    })

                });


            // Read Worker response
            const result =
                await response.json();


            console.log(
                "FULL WORKER RESPONSE:",
                result
            );


            // Check verification result
            if (!result.success) {

                throw new Error(
                    result.error ||
                    "Payment verification failed."
                );
            }


            // Make sure Worker returned a download URL
            if (
                !result.product ||
                !result.product.downloadUrl
            ) {

                throw new Error(
                    "Download link was not returned."
                );
            }


            // Get the REAL GitHub file URL
            const downloadURL =
                result.product.downloadUrl;


            const fileName =
                result.product.file;


            // Set download link
            downloadButton.href =
                downloadURL;


            // Tell browser the filename
            downloadButton.download =
                fileName;


            // Show button
            downloadButton.style.display =
                "inline-block";


            // Update status
            statusBox.textContent =
                "Your product is ready. Click the button below to access it.";


        } catch (error) {

            console.error(
                "DOWNLOAD ERROR:",
                error
            );


            statusBox.textContent =
                "Could not prepare your download. Please try again.";


            statusBox.classList.add("error");
        }
    }


    // Start verification
    verifyPayment();

</script>

</body>
</html>
