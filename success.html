<body>


<div class="container">

        FORGE<span>DIGITAL</span>

        <div class="success-icon">
            ✓
        </div>


        <h1>

                </span>

            </div>


        </div>


        <button
            id="downloadButton"
            class="download"
            type="button"
        >

        </button>

        ></div>

<script>


// =====================================
// GET PAYMENT INFORMATION
// =====================================

const params =
    new URLSearchParams(
        window.location.search
    );


const reference =
    params.get("reference");


const productId =
    params.get("product");


document.getElementById(
    "reference"
).textContent =
    reference || "Not available";


// =====================================
// ALL 20 PRODUCTS
// =====================================

const products = {

    "AI-Prompts-Digital-Products-Kit": {
        name: "AI Prompts Digital Products Kit",
        file: "AI-Prompts-Digital-Products-Kit.md"
    },

    "AI-Content-Creator-Template-Pack": {
        name: "AI Content Creator Template Pack",
        file: "AI-Content-Creator-Template-Pack.md"
    },

    "AI-Business-Marketing-Prompt-Pack": {

        file: "AI-Business-Marketing-Prompt-Pack.md"
    },

    "AI-Resume-Career-Prompt-Kit": {
        name: "AI Resume Career Prompt Kit",
        file: "AI-Resume-Career-Prompt-Kit.md"
    },

    "AI-Social-Media-Content-Kit": {
        name: "AI Social Media Content Kit",
        file: "AI-Social-Media-Content-Kit.md"
    },

    "AI-YouTube-Creator-Prompt-Pack": {
        name: "AI YouTube Creator Prompt Pack",
        file: "AI-YouTube-Creator-Prompt-Pack.md"
    },

    "AI-Business-Idea-Generator-Kit": {
        name: "AI Business Idea Generator Kit",
        file: "AI-Business-Idea-Generator-Kit.md"
    },

    "AI-Freelancer-Prompt-Kit": {
        name: "AI Freelancer Prompt Kit",
        file: "AI-Freelancer-Prompt-Kit.md"
    },

    "AI-Email-Marketing-Prompt-Pack": {
        name: "AI Email Marketing Prompt Pack",
        file: "AI-Email-Marketing-Prompt-Pack.md"
    },

    "AI-Copywriting-Prompt-Master-Kit": {
        name: "AI Copywriting Prompt Master Kit",
        file: "AI-Copywriting-Prompt-Master-Kit.md"
    },

    "AI-Website-Creation-Prompt-Kit": {
        name: "AI Website Creation Prompt Kit",
        file: "AI-Website-Creation-Prompt-Kit.md"
    },

    "AI-Graphic-Design-Prompt-Pack": {
        name: "AI Graphic Design Prompt Pack",
        file: "AI-Graphic-Design-Prompt-Pack.md"
    },

    "AI-Productivity-Prompt-Kit": {
        name: "AI Productivity Prompt Kit",
        file: "AI-Productivity-Prompt-Kit.md"
    },

    "AI-Study-Prompt-Pack": {
        name: "AI Study Prompt Pack",
        file: "AI-Study-Prompt-Pack.md"
    },

    "AI-Ecommerce-Prompt-Kit": {
        name: "AI Ecommerce Prompt Kit",
        file: "AI-Ecommerce-Prompt-Kit.md"
    },

    "AI-Small-Business-Prompt-Pack": {
        name: "AI Small Business Prompt Pack",
        file: "AI-Small-Business-Prompt-Pack.md"
    },

    "AI-Instagram-Growth-Prompt-Kit": {
        name: "AI Instagram Growth Prompt Kit",
        file: "AI-Instagram-Growth-Prompt-Kit.md"
    },

    "AI-ChatGPT-Master-Prompt-Pack": {
        name: "AI ChatGPT Master Prompt Pack",
        file: "AI-ChatGPT-Master-Prompt-Pack.md"
    },

    "AI-Digital-Product-Creator-Kit": {
        name: "AI Digital Product Creator Kit",
        file: "AI-Digital-Product-Creator-Kit.md"
    },

    "Ultimate-AI-Prompt-Bundle": {
        name: "Ultimate AI Prompt Bundle",
        file: "Ultimate-AI-Prompt-Bundle.md"
    }

};


// =====================================
// SHOW PRODUCT NAME
// =====================================

const product =
    products[productId];


document.getElementById(
    "productName"
).textContent =
    product
        ? product.name
        : "Digital Product";


// =====================================
// DOWNLOAD BUTTON
// =====================================

const downloadButton =
    document.getElementById(
        "downloadButton"
    );


const downloadStatus =
    document.getElementById(
        "downloadStatus"
    );


downloadButton.addEventListener(
    "click",
    async function () {


        if (!product) {

            downloadStatus.textContent =
                "Product file not found.";

            return;

        }


        downloadButton.disabled = true;

        downloadButton.textContent =
            "Preparing Download...";

        downloadStatus.textContent =
            "Please wait...";


        // GitHub raw file URL

        const folder =
            product.name;


        const rawUrl =
            "https://raw.githubusercontent.com/" +
            "forge-digital-gh/DIGITAL-PRODUCTS-2.0/" +
            "main/" +
            encodeURIComponent(folder).replace(
                /%2F/g,
                "%20"
            ) +
            "/" +
            product.file;


        try {


            const response =
                await fetch(rawUrl);


            if (!response.ok) {

                throw new Error(
                    "File not found"
                );

            }


            const blob =
                await response.blob();


            const blobUrl =
                URL.createObjectURL(blob);


            const link =
                document.createElement("a");


            link.href =
                blobUrl;


            link.download =
                product.file;


            document.body.appendChild(
                link
            );


            link.click();


            link.remove();


            URL.revokeObjectURL(
                blobUrl
            );


            downloadStatus.textContent =
                "Download started ✓";


        } catch (error) {


            console.error(error);


            downloadStatus.textContent =
                "Download failed. Please check the product file.";


        }


        downloadButton.disabled =
            false;


        downloadButton.textContent =
            "Download Product →";


    }
);

</script>


</body>
