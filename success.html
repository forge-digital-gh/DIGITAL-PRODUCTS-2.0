<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

          content="width=device-width, initial-scale=1.0">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-size: 25px;

            margin-bottom: 25px;
        }

        .detail {
            display: flex;

            justify-content: space-between;

            gap: 20px;

            padding: 12px 0;

            border-bottom: 1px solid #22222d;
        }

        .detail:last-child {
            border-bottom: none;
        }

        .detail span:first-child {
            color: #777;
        }

        .detail span:last-child {
            color: white;

            text-align: right;

            word-break: break-word;
        }

        .download {
            display: block;

            width: 100%;

            padding: 17px;

            background: #8b5cf6;

            color: white;

            border-radius: 12px;

            text-decoration: none;

            font-weight: 900;

            font-size: 16px;

            cursor: pointer;

            transition: .3s ease;
        }

        .download:hover {
            background: #a78bfa;

        .home {

</head>


<body>


<div class="container">


    <div class="logo">
        FORGE<span>DIGITAL</span>

    <div class="card">


        <div class="success-icon">
            ✓
        </div>


        <h1>
            Payment Successful!
        </h1>


        <p class="message">
            Thank you for your purchase.

        <div class="details">


            <div class="detail">

                <span>

                <span id="productName">

                <span>
                    Reference
                </span>

                    Loading...
                </span>

            <div class="detail">

                <span>
                    Status
                </span>

                <span style="color:#8b5cf6;">
                    PAID ✓
                </span>

            </div>


        </div>


        <a
            id="downloadButton"
            href="#"
            class="download"
            download
        >

        </a>

        >

        </a>


        <p class="warning">
            Keep your payment reference for your records.
        </p>


    </div>


</div>


<script>


const params =
    new URLSearchParams(
        window.location.search
    );


const reference =
    params.get("reference");


const productId =
    params.get("product");


// ==========================
// PRODUCT NAMES
// ==========================

const names = {

    "AI-Prompts-Digital-Products-Kit":
        "AI Prompts Digital Products Kit",

    "AI-Content-Creator-Template-Pack":
        "AI Content Creator Template Pack",

    "AI-Business-Marketing-Prompt-Pack":
        "AI Business Marketing Prompt Pack",

    "AI-Resume-Career-Prompt-Kit":
        "AI Resume Career Prompt Kit"

};


// ==========================
// GITHUB DOWNLOAD FILES
// ==========================

const downloads = {

    "AI-Prompts-Digital-Products-Kit":
        "https://forge-digital-gh.github.io/DIGITAL-PRODUCTS-2.0/AI%20Prompts%20Digital%20Products%20Kit/AI-Prompts-Digital-Products-Kit.md",

    "AI-Content-Creator-Template-Pack":
        "https://forge-digital-gh.github.io/DIGITAL-PRODUCTS-2.0/AI%20Content%20Creator%20Template%20Pack/AI-Content-Creator-Template-Pack.md",

    "AI-Business-Marketing-Prompt-Pack":
        "https://forge-digital-gh.github.io/DIGITAL-PRODUCTS-2.0/AI%20Business%20Marketing%20Prompt%20Pack/AI-Business-Marketing-Prompt-Pack.md",

    "AI-Resume-Career-Prompt-Kit":
        "https://forge-digital-gh.github.io/DIGITAL-PRODUCTS-2.0/AI%20Resume%20Career%20Prompt%20Kit/AI-Resume-Career-Prompt-Kit.md"

};


// ==========================
// DISPLAY DATA
// ==========================

document.getElementById(
    "productName"
).textContent =
    names[productId] || "Digital Product";


document.getElementById(
    "reference"
).textContent =
    reference || "Not available";


// ==========================
// DOWNLOAD
// ==========================

const downloadButton =
    document.getElementById(
        "downloadButton"
    );


if (downloads[productId]) {

    downloadButton.href =
        downloads[productId];

    downloadButton.setAttribute(
        "download",
        names[productId] + ".md"
    );

} else {

    downloadButton.textContent =
        "Product File Not Found";

    downloadButton.style.opacity =
        "0.5";

    downloadButton.style.pointerEvents =
        "none";

}


</script>


</body>

</html>
