<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Successful | Forge Digital</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .box {
            max-width: 500px;
            width: 100%;
            text-align: center;
            background: #101010;
            padding: 40px 25px;
            border-radius: 20px;
            border: 1px solid #292929;
        }

        .icon {
            font-size: 60px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #aaa;
        }

        #status {
            margin: 25px 0;
            padding: 15px;
            background: #181818;
            border-radius: 10px;
            color: #c8ff35;
        }

        #downloadButton {
            display: none;
            padding: 15px 25px;
            background: #c8ff35;
            color: #050505;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .error {
            color: #ff5555 !important;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="icon">✓</div>

    <h1>Payment Successful</h1>

    <p>Your payment has been verified.</p>

    <div id="status">
        Preparing your download...
    </div>

    <a id="downloadButton">
        Download Your Product →
    </a>

</div>


<script>

const WORKER_URL =
    "https://forge-digital-payment-v2.rampagewwe2.workers.dev/";

const params =
    new URLSearchParams(window.location.search);

const reference =
    params.get("reference");

const productId =
    params.get("product");

const status =
    document.getElementById("status");

const downloadButton =
    document.getElementById("downloadButton");


async function verifyPayment() {

    if (!reference || !productId) {

        status.textContent =
            "Missing payment information.";

        status.classList.add("error");

        return;
    }

    try {

        const response =
            await fetch(WORKER_URL, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    reference: reference,

                    product: productId

                })

            });


        const result =
            await response.json();


        console.log(result);


        if (!result.success) {

            throw new Error(
                result.error ||
                "Payment verification failed."
            );
        }


        // CREATE DOWNLOAD PATH
        const downloadURL =
            WORKER_URL +
            "download?reference=" +
            encodeURIComponent(reference) +
            "&product=" +
            encodeURIComponent(productId);


        downloadButton.href =
            downloadURL;


        downloadButton.style.display =
            "inline-block";


        status.textContent =
            "Your product is ready. Click below to download.";


    } catch (error) {

        console.error(error);

        status.textContent =
            "Could not prepare your download.";

        status.classList.add("error");
    }
}


verifyPayment();

</script>

</body>
</html>
